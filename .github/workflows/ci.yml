name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python 3.14
      - name: isort
        run: uv run isort --check-only --diff src tests
      - name: mypy
        run: uv run mypy
      - name: pylint
        run: uv run pylint src tests
      - name: numpydoc
        run: uv run numpydoc lint src/martes/*.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run tests
        run: >
          uv run --python ${{ matrix.python-version }}
          --no-default-groups --group test
          pytest

  test-lowest:
    name: test (3.11, lowest deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run tests against the declared dependency floor
        run: >
          uv run --python 3.11
          --no-default-groups --group test
          --resolution lowest-direct
          pytest
