name: Release

on:
  push:
    tags: ["v*"]

jobs:
  check-version:
    name: Tag matches project version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag against pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          echo "tag=$tag pyproject=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    needs: [check-version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Check the built package installs and imports
        run: >
          uv run --isolated --no-project
          --with ./dist/*.whl
          python -c "import martes; print(martes.__name__)"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/*.whl dist/*.tar.gz
          --title "$GITHUB_REF_NAME"
          --generate-notes
