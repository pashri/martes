[project]
name = "martes"
version = "0.1.1"
description = "Read an Excel workbook in Pandas and reference cells by coordinates"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Patrick Linton", email = "patrickdaniellinton@gmail.com" },
]
keywords = [
    "pandas",
    "excel",
    "xlsx",
    "spreadsheet",
    "openpyxl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.2.2",
    "openpyxl>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/pashri/martes"
Repository = "https://github.com/pashri/martes"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/martes"]

[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    { include-group = "test" },
    "pylint>=3.0",
    "mypy>=1.0",
    "isort>=5.0",
    "numpydoc>=1.6",
    "pandas-stubs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=martes --cov-report=term-missing"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
line_length = 79
src_paths = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[tool.pylint.format]
max-line-length = 79

[tool.pylint.design]
max-statements = 6

[tool.numpydoc_validation]
# "all" enables every check; the rest are exclusions.
# GL01 wants the summary below the quotes, contradicting PEP 257.
checks = ["all", "ES01", "EX01", "SA01", "GL08", "GL01"]
exclude = ["^test_", "\\.__init__$"]
